# Gitleaks config for anvil
#
# Gitleaks scans git history for secrets, API keys, tokens, and
# credentials. This config defines allowlist rules to suppress
# known false positives.
#
# Run via: gitleaks detect --source . --no-git -v
# CI: runs via gitleaks-action in ci-workflow.yml

title = "anvil gitleaks config"

# Extend default rules — use all built-in rules plus any custom ones
[extend]
useDefault = true

# Allowlist: paths, regexes, and commits to exclude
[allowlist]
description = "Known false positives for the anvil codebase"

# Directories that contain test fixtures, sample data, or generated content
paths = [
    # Test data and fixtures with intentional credential-like strings
    "(?i)tests/",
    # Demo/sample data
    "(?i)anvil/data/demo/",
    # Documentation that references example credentials
    "(?i)docs/",
    # Lock files (dependency checksums, not secrets)
    "(?i)uv\\.lock$",
    ".specify/",
    ".opencode/",
]

# Regex patterns for known false positives
regexes = [
    # Pytest fixture names that look like tokens
    "(?i)fixture.*token",
    "(?i)mock.*key",
    "(?i)fake.*secret",
    "(?i)placeholder.*key",
    "(?i)example.*token",

    # Version strings that look like hashes
    "^v?\\d+\\.\\d+\\.\\d+$",

    # Hash-like strings in URLs
    "https://[^/]+/[^/]+/[a-f0-9]{40}",

    # Documentation example values
    "(?i)your-api-key-here",
    "(?i)your-secret-key",

    # UUIDs (not secrets, just identifiers)
    "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",

    # Base64 strings in test data
    "(?i)test.*base64",
]

# Commits that introduced false positives (add as they're discovered)
commits = []