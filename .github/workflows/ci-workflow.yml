# CI workflow: gate enforcement for anvil
#
# Runs the project's declared quality gates on every PR and push.
# SonarCloud scan is temporarily disabled (2026-07-19). See #temporary-disable-sonarcloud.
# Branch protection configuration must require this workflow to pass on main.
#
# FR-001/FR-002: validates every change against all declared gates
# FR-003: blocks merge on failure (via branch protection settings)
# FR-005: runs same commands as local dev (make targets)
# FR-006a: version-only bump PRs bypass heavy gates via bump-scope-guard

name: CI Gates

"on":
  pull_request:
  push:
    branches:
      - main

# Security: deny-by-default for all GITHUB_TOKEN permissions.
# Fork PRs get read-only token regardless — this is defense-in-depth
# for push/workflow_dispatch runs and against event-context confusion.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # ── Classification job: determine whether to run the heavy gate suite ──
  bump-scope-guard:
    name: Bump Scope Guard
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Log fork status
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "::notice::Running on fork PR — installing the package executes untrusted code."
            echo "::notice::Mitigation: GitHub approval gate required for first-time contributors."
          fi
      # Do NOT replace with a bare `pip install`: the self-hosted runner has no pip,
      # and the resulting exit-127 skips every downstream gate while Gate Status passes.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install anvil
        run: |
          uv venv
          uv pip install .
      # Call the console script directly, not via `uv run`: `uv run` re-resolves the
      # project including extras, and anvil[compute] is currently unsatisfiable
      # (core requires protobuf>=7.35.1; modal caps protobuf below 7.0).
      - name: Classify change scope
        id: classify
        run: |
          .venv/bin/anvil-vault check-bump-scope > scope_output.txt
          cat scope_output.txt
          SCOPE=$(grep "^BUMP_SCOPE=" scope_output.txt | cut -d= -f2)
          echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"
      - name: Upload scope artifact
        uses: actions/upload-artifact@v7
        with:
          name: bump-scope-output
          path: scope_output.txt

  # ── Lint gate ──
  lint:
    name: Lint
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    needs: bump-scope-guard
    if: needs.bump-scope-guard.outputs.scope != 'version-only' && github.ref_name != 'main'
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Setup environment
        run: make setup
      - name: Run lint
        run: make lint

  # ── Auto-format gate (skipped on fork PRs: can't push back) ──
  format:
    name: Auto-format
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    needs: bump-scope-guard
    if: needs.bump-scope-guard.outputs.scope != 'version-only' && github.ref_name != 'main' && github.event.pull_request.head.repo.fork == false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Setup environment
        run: make setup
      - name: Run auto-format
        run: make format
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --exit-code; then
            git commit -m "style: auto-format with black + isort [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          else
            echo "No formatting changes needed."
          fi

  # ── Type-check gate ──
  typecheck:
    name: Type Check
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    needs: bump-scope-guard
    if: needs.bump-scope-guard.outputs.scope != 'version-only' && github.ref_name != 'main'
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Setup environment
        run: make setup
      - name: Run typecheck
        run: make typecheck

  # ── Test + coverage gate ──
  test:
    name: Test
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    needs: bump-scope-guard
    if: needs.bump-scope-guard.outputs.scope != 'version-only' && github.ref_name != 'main'
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Setup environment
        run: make setup
      - name: Run tests with coverage
        run: make test

  # ── SonarCloud static analysis + coverage gate (DISABLED 2026-07-19) ──
  # sonar-scan:
  #   name: SonarCloud
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 20
  #   needs: bump-scope-guard  # self-contained — runs its own tests to generate coverage.xml
  #   if: needs.bump-scope-guard.outputs.scope != 'version-only'
  #   continue-on-error: true  # non-blocking; requires SONAR_TOKEN secret and auto-analysis disabled upstream
  #   steps:
  #     - uses: actions/checkout@v7
  #       with:
  #         fetch-depth: 0  # full history for blame/tracking
  #     - name: Install uv
  #       uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
  #       with:
  #         python-version: ${{ env.PYTHON_VERSION }}
  #     - name: Setup environment
  #       run: make setup
  #     - name: Run tests with coverage (generates coverage.xml)
  #       run: make test
  #     - name: Run SonarCloud scan
  #       uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e  # v8.2.0
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #         SONAR_SCANNER_OPTS: "-Dsonar.scanner.skipJreProvisioning=true"

  # ── Vault audit gate ──
  vault-audit:
    name: Vault Audit
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    needs: bump-scope-guard
    if: needs.bump-scope-guard.outputs.scope != 'version-only' && github.ref_name != 'main'
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Setup environment
        run: make setup
      - name: Run vault audit
        run: make vault-audit

  # ── Constitution mechanical checks gate ──
  constitution-check:
    name: Constitution Checks
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    needs: bump-scope-guard
    if: needs.bump-scope-guard.outputs.scope != 'version-only' && github.ref_name != 'main'
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Setup environment
        run: make setup
      - name: Run constitution checks
        run: make constitution-check

  # ── UX lint gate (deterministic, no network) ──
  ux-lint:
    name: UX Lint
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    needs: bump-scope-guard
    if: needs.bump-scope-guard.outputs.scope != 'version-only' && github.ref_name != 'main'
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Setup environment
        run: make setup
      - name: Run UX lint
        run: make ux-lint

  # ── Gate status summarizer ──
  gate-status:
    name: Gate Status
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 3
    needs: [bump-scope-guard, format, lint, typecheck, test, vault-audit, constitution-check, ux-lint]
    if: always()
    steps:
      - name: Summarize gate results
        run: |
          echo "## Gate Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| bump-scope-guard | ${{ needs.bump-scope-guard.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| format | ${{ needs.format.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lint | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| typecheck | ${{ needs.typecheck.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| test | ${{ needs.test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          # echo "| sonar-scan | DISABLED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| vault-audit | ${{ needs.vault-audit.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| constitution-check | ${{ needs.constitution-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ux-lint | ${{ needs.ux-lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # Without this, Gate Status only summarises and always succeeds, so a failed
      # gate cannot block a merge. "skipped" stays acceptable: gates are legitimately
      # skipped for version-only bumps and on pushes to main.
      - name: Enforce gate results
        run: |
          failed=""
          for gate in \
            "bump-scope-guard=${{ needs.bump-scope-guard.result }}" \
            "format=${{ needs.format.result }}" \
            "lint=${{ needs.lint.result }}" \
            "typecheck=${{ needs.typecheck.result }}" \
            "test=${{ needs.test.result }}" \
            "vault-audit=${{ needs.vault-audit.result }}" \
            "constitution-check=${{ needs.constitution-check.result }}" \
            "ux-lint=${{ needs.ux-lint.result }}"; do
            name="${gate%%=*}"
            result="${gate#*=}"
            case "$result" in
              success|skipped) ;;
              *) failed="${failed} ${name}(${result})" ;;
            esac
          done
          if [ -n "${failed}" ]; then
            echo "::error::Gates did not pass:${failed}"
            exit 1
          fi
          echo "All gates passed or were legitimately skipped."
