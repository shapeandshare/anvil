{# ── Annotation Toolbar ── #}
<div id="annotation-toolbar" class="feedback-annotation-toolbar" style="display:none;" role="toolbar" aria-label="Annotation tools">
  <button type="button" class="feedback-annotation-toolbar__btn" data-tool="element" aria-label="Select element on page" title="Element select">
    <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/>
      <path d="M12 8v8M8 12h8"/>
    </svg>
  </button>
  <button type="button" class="feedback-annotation-toolbar__btn" data-tool="freehand" aria-label="Freehand drawing" title="Freehand">
    <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M3 17c3-4 6-1 8-3s4-5 6-6 4 2 3 5-5 10-8 11-5-2-3-5"/>
    </svg>
  </button>

  <span class="feedback-annotation-toolbar__sep" aria-hidden="true"></span>

  <button type="button" class="feedback-annotation-toolbar__btn" id="annotation-toolbar-undo" aria-label="Undo last annotation" title="Undo">
    <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="1 4 1 10 7 10"/>
      <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
    </svg>
  </button>
  <button type="button" class="feedback-annotation-toolbar__btn" id="annotation-toolbar-clear" aria-label="Clear all annotations" title="Clear">
    <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    </svg>
  </button>

  <span class="feedback-annotation-toolbar__sep" aria-hidden="true"></span>

  <button type="button" class="feedback-annotation-toolbar__btn" id="annotation-toolbar-submit" aria-label="Submit annotations" title="Submit">
    <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </button>
  <button type="button" class="feedback-annotation-toolbar__btn" id="annotation-toolbar-close" aria-label="Close annotation mode" title="Close">
    <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>
