[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil"
version = "0.16.4"
description = "Train and experiment with small LLMs from scratch"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Josh Burt", email = "joshburt@shapeandshare.com"},
]

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1.6,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.22.1,<1",
    "alembic>=1.18.5,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.14.2,<3",
    "aiofiles>=24.0,<25",
    "python-dotenv>=1.2.2,<2",
    "httpx>=0.27,<1",
    "pathspec>=1.1.1,<2",
    "psutil>=7.2.2,<8",
    "python-multipart>=0.0.18,<1",
    "mlflow>=3.14.0,<4",  # resolved version: 3.13.0
    "safetensors>=0.4,<1",
    "numpy>=1.24,<2",
"networkx>=3.6.1",
    "pyyaml>=6,<7",
    "starlette>=1.3.1,<2",  # transitive via fastapi/mlflow; CVE-2026-54283 (DoS via form limits)
]

[tool.setuptools.packages.find]
include = ["anvil*"]

[tool.setuptools.package-data]
anvil = [
    "py.typed",
    "_resources/alembic.ini",
    "_resources/migrations/*.py",
    "_resources/migrations/*.mako",
    "_resources/migrations/versions/*.py",
    "data/demo/**/*.txt",
    "data/demo/**/*.md",
    "data/demo/**/*.json",
    "data/curated-models.yaml",
    "api/static/**/*",
    "api/templates/**/*",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.13.0,<3",
    "nvidia-ml-py>=12,<13",
]
compute = [
    "modal>=0.70,<1",
]
vault-health = [
    "networkx>=3,<4",
]
dev = [
    "ruff>=0.5,<1",
    "black>=26.3.1,<27",
    "isort>=8.0.1,<9",
    "pylint>=3.2,<4",
    "mypy>=1.10,<2",
    "moto>=5.0,<6",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5.0,<6",
    "coverage>=7.0,<8",
    "commitizen>=4,<5",
    "pytest-playwright>=0.5,<1",
    "bandit>=1.7,<2",
    "semgrep>=1.60,<2",
]
finetune = [
    "huggingface_hub>=0.24,<2",
    "tokenizers>=0.23.1,<1",
    "sentencepiece>=0.1.99,<1",
    "transformers>=5.14.1,<6",
    "peft>=0.7,<1",
    "bitsandbytes>=0.41,<1",
    "datasets>=2.14,<3",
    "accelerate>=0.24,<1",
]

[project.scripts]
anvil = "anvil.cli:main"
anvil-train = "anvil.cli:train"
anvil-corpus = "anvil.cli:corpus_main"
anvil-stop = "anvil.cli:stop"
anvil-bootstrap-datasets = "anvil.cli:bootstrap_datasets_main"
anvil-db = "anvil.cli:db_main"
anvil-vault = "anvil.services.vault.cli:main"
anvil-show-api-key = "anvil.cli:show_api_key"
anvil-backup = "anvil.services.backup.cli:main"
anvil-import = "anvil.cli:import_main"
anvil-import-status = "anvil.cli:import_status_main"
anvil-instance = "anvil.services.instances.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "UP", "ASYNC", "RUF", "D"]
ignore = ["E501", "B008", "D205", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "D100", "D104"]
"tests/**/*.py" = ["E402", "F401", "B007", "B011", "B017", "C401", "F841", "RUF001", "RUF002", "RUF005", "RUF006", "RUF012", "RUF015", "RUF043", "RUF059", "E741", "ASYNC240", "D100", "D101", "D102", "D103", "D104", "D107"]
"anvil/_resources/migrations/**" = ["E402", "F401", "RUF002", "D"]
"scripts/**" = ["D"]
"anvil/api/v1/corpora.py" = ["E741"]
"anvil/api/v1/datasets.py" = ["B904"]
"anvil/api/v1/eval.py" = ["ASYNC240"]
"anvil/api/v1/experiments.py" = ["ASYNC240", "ASYNC230"]
"anvil/api/v1/router.py" = ["ASYNC221", "ASYNC240", "B904"]
"anvil/api/v1/training.py" = ["ASYNC230"]
"anvil/db/repositories/instance_registry.py" = ["ASYNC240"]
"anvil/services/backup/cli.py" = ["ASYNC240"]
"anvil/services/inference/inference.py" = ["ASYNC240"]
"anvil/services/compute/local_stdlib_backend.py" = ["ASYNC240"]
"anvil/services/compute/local_torch_backend.py" = ["ASYNC230"]
"anvil/services/instances/instance_lifecycle_service.py" = ["ASYNC220", "ASYNC240"]
"anvil/services/instances/workspace_lock.py" = ["ASYNC240"]
"anvil/workspace/workspace_paths.py" = ["D102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["anvil"]

[tool.pylint]
max-line-length = 88
disable = [
    "E0401", "E0611", "E1101", "E1102", "E1136",
    "R0801", "too-many-arguments",
    "too-many-branches", "too-many-instance-attributes",
    "too-many-lines", "too-many-locals",
    "too-many-public-methods", "too-many-return-statements",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-cast",
    "redundant-expr",
]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "anvil.services.tracking"
ignore_errors = true  # TODO(ADR-0NN): narrow to specific error codes; blocked by mlflow stubs

[[tool.mypy.overrides]]
module = "anvil.services.tracking.mlflow_inputs"
ignore_errors = true  # TODO(ADR-0NN): narrow to specific error codes; blocked by mlflow stubs



[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --cov=anvil --cov-report=term-missing --ignore=tests/system --ignore=tests/browser"

[tool.coverage.run]
source = ["anvil"]
omit = ["tests/*", "anvil/_resources/migrations/*", "tests/system/*", "tests/browser/*"]

[tool.coverage.report]
fail_under = 23
show_missing = true

[tool.bandit]
# Exclude test, build, and third-party directories from security analysis
exclude_dirs = ["tests", ".venv", "examples", "scripts", ".github"]
targets = ["anvil"]
# Skip known false-positive / intentional patterns:
#   B101 — assert statements used intentionally for type narrowing
#   B105 — false positives on config key names (hf_token, HF_TOKEN) and tokenizer constants
#   B106 — false positives on bos_token parameter names (not passwords)
#   B107 — false positives on bos_token="" default values (not passwords)
#   B311 — random.uniform() for non-crypto jitter/sampling
#   B404 — subprocess import (informational only)
#   B603 — subprocess with list args (safe by design, not shell=True)
#   B607 — git on PATH is standard (not a partial-path vulnerability)
#   B615 — from_pretrained() calls prefer local assets; hub fallback uses
#          user-configured model IDs where we can't pin commit hashes statically.
#          Acceptable risk: local paths are false positives, hub models are
#          user-specified (not programmatic injection).
skips = ["B101", "B104", "B105", "B106", "B107", "B311", "B404", "B603", "B607", "B615"]

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "semver"
tag_format = "v$version"
version_provider = "pep621"
update_changelog_on_bump = true
changelog_incremental = true
changelog_file = "CHANGELOG.md"
# Don't use "bump:" prefix (which cz_conventional_commits parses as a
# conventional commit).  Using a non-standard prefix means cz bump
# --changelog won't include the bump commit itself — only the actual
# source PR changes appear in the CHANGELOG.
bump_message = "release v$new_version [skip ci]"
